name: lint
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  mod-tidy:
    name: mod-tidy
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/canonical/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          go-version: '1.18'
          cache: false
      - name: Check go mod tidy
        run: ./internal/check-tidy.sh
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/canonical/
      GH_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          go-version: '1.16'
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.54
          # args: --timeout=30m --config=/my/path/.golangci.yml --issues-exit-code=0
