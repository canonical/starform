name: Starform Go Tests
on: [push, pull_request]
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: [1.18.x, 1.19.x, 1.20.x, 1.21.x]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Configure git to use ssh
        run: git config --global url."ssh://$GH_ORG_ACCESS_TOKEN@github.com/".insteadOf https://github.com/
        env:
          GH_ORG_ACCESS_TOKEN: ${{ secrets.GH_ORG_ACCESS_TOKEN }}
      - name: Run tests
        shell: bash
        run: 'internal/test.sh'
